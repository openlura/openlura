<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>openlura — демо лица</title>
<meta name="description" content="Открытый движок лица Луры: 50 эмоций, чистый JS + SVG без зависимостей.">
<link rel="stylesheet" href="../src/face.css">
<style>
  :root {
    color-scheme: dark;
    --ink: #eaeefb;
    --muted: #8b93a9;
    --line: rgba(150, 170, 255, .14);
    --accent: #7b96ff;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }

  body {
    margin: 0;
    min-height: 100%;
    background: #04060c;
    color: var(--ink);
    font: 15px/1.5 "Inter", "Segoe UI Variable", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 26px;
    padding: 40px 20px;
    position: relative;
    overflow-x: hidden;
  }

  /* фон: два медленных световых пятна + сетка */
  .aurora {
    position: fixed;
    inset: -20vmax;
    z-index: -2;
    background:
      radial-gradient(38vmax 30vmax at 22% 12%, rgba(76, 110, 255, .22), transparent 62%),
      radial-gradient(34vmax 28vmax at 82% 8%, rgba(255, 120, 180, .13), transparent 62%),
      radial-gradient(46vmax 36vmax at 50% 96%, rgba(60, 210, 200, .10), transparent 66%);
    filter: blur(6px);
    animation: drift 26s ease-in-out infinite alternate;
  }
  @keyframes drift {
    from { transform: translate3d(-1.5%, -1%, 0) scale(1); }
    to   { transform: translate3d(1.8%, 1.4%, 0) scale(1.06); }
  }
  .grid {
    position: fixed;
    inset: 0;
    z-index: -1;
    background-image:
      linear-gradient(to right, rgba(150, 170, 255, .055) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(150, 170, 255, .055) 1px, transparent 1px);
    background-size: 64px 64px;
    mask-image: radial-gradient(70% 55% at 50% 40%, #000 0%, transparent 78%);
    -webkit-mask-image: radial-gradient(70% 55% at 50% 40%, #000 0%, transparent 78%);
  }

  /* шапка */
  header {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 16px;
    font-weight: 650;
    letter-spacing: -.2px;
  }
  .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 0 4px rgba(123, 150, 255, .16), 0 0 18px rgba(123, 150, 255, .9);
    animation: pulse 2.8s ease-in-out infinite;
  }
  @keyframes pulse {
    50% { box-shadow: 0 0 0 6px rgba(123, 150, 255, .08), 0 0 26px rgba(123, 150, 255, 1); }
  }
  header span { color: var(--muted); font-weight: 450; }

  /* сцена */
  .card {
    width: min(100%, 560px);
    border-radius: 26px;
    padding: 1px;
    background: linear-gradient(160deg, rgba(160, 180, 255, .38), rgba(160, 180, 255, .05) 42%, rgba(255, 160, 200, .16));
    box-shadow: 0 30px 80px -28px rgba(70, 100, 255, .5), 0 2px 0 rgba(255, 255, 255, .05) inset;
  }
  #stage {
    position: relative;
    aspect-ratio: 1000 / 640;
    border-radius: 25px;
    overflow: hidden;
    background:
      radial-gradient(80% 55% at 50% -12%, rgba(96, 130, 255, .30), transparent 70%),
      radial-gradient(60% 50% at 50% 118%, rgba(255, 130, 190, .12), transparent 72%),
      #070a12;
    --mood: 61 123 255;
    --mood-k: .62;
    --void-rgb: 0 0 0;
    --glow: #8aa2ff;
    --blush: #ff9ec9;
  }
  #stage::after {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: linear-gradient(to bottom, transparent 70%, rgba(4, 6, 12, .62));
  }

  /* чипы эмоций */
  .chips {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
    width: min(100%, 560px);
  }
  .chips button {
    font: inherit;
    font-size: 12.5px;
    padding: 7px 13px;
    border-radius: 999px;
    background: rgba(255, 255, 255, .045);
    border: 1px solid var(--line);
    color: #c6cde2;
    cursor: pointer;
    transition: .16s;
  }
  .chips button:hover {
    color: #fff;
    border-color: rgba(140, 165, 255, .5);
    background: rgba(123, 150, 255, .14);
  }
  .chips button[aria-pressed="true"] {
    color: #fff;
    background: linear-gradient(180deg, rgba(123, 150, 255, .34), rgba(123, 150, 255, .18));
    border-color: rgba(140, 165, 255, .62);
    box-shadow: 0 0 22px -6px rgba(123, 150, 255, .8);
  }

  footer {
    font-size: 11.5px;
    color: rgba(139, 147, 169, .75);
    text-align: center;
  }
  footer a { color: #b7c2e0; text-decoration: none; border-bottom: 1px solid rgba(183, 194, 224, .28); }
  footer a:hover { color: #fff; border-bottom-color: rgba(255, 255, 255, .6); }

  @media (max-width: 460px) {
    body { padding: 28px 14px; gap: 20px; justify-content: flex-start; }
    .chips button { font-size: 12px; padding: 6px 11px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .aurora, .dot { animation: none; }
  }
</style>
</head>
<body>

<div class="aurora" aria-hidden="true"></div>
<div class="grid" aria-hidden="true"></div>

<header>
  <span class="dot" aria-hidden="true"></span>
  <span><strong style="color: var(--ink)">openlura</strong> <span>/ демо</span></span>
</header>

<main class="card">
  <div id="stage" role="img" aria-label="Анимированное лицо Луры"></div>
</main>

<nav class="chips" id="chips" aria-label="Эмоции"></nav>

<footer>
  тап по лицу — <code>poke()</code> · 50 эмоций · <a href="../README.md">README</a>
</footer>

<script type="module">
  import { Face, EMOTIONS } from "../src/face.js";

  const host = document.getElementById("stage");
  const face = new Face(host, { idle: true, particles: true });

  const QUICK = [
    ["calm", "Спокойна"],
    ["surprised", "Удивление"],
    ["excited", "Восторг"],
    ["playful", "Игривая"],
    ["shy", "Смущение"],
    ["love", "Влюблена"],
    ["laugh", "Смех"],
    ["sleepy", "Сонная"],
    ["angry", "Злая"],
  ];

  const chips = document.getElementById("chips");
  const els = QUICK.filter(([key]) => EMOTIONS[key]).map(([key, label]) => {
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = label;
    b.dataset.emotion = key;
    b.setAttribute("aria-pressed", String(key === "calm"));
    b.addEventListener("click", () => {
      face.setEmotion(key, { intensity: 1 });
      for (const el of els) el.setAttribute("aria-pressed", String(el === b));
    });
    chips.append(b);
    return b;
  });

  face.attach(host, { haptic: false });
</script>

</body>
</html>
